<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The desktop app's Content Security Policy is a response header from the shell's
      app:// handler (the kit's server/src/shell/main.js); no meta-tag CSP here — it
      would also bind Vite's dev server and the headless UI.
    -->
    <title>JustWrite</title>
    <!-- No font preconnects: the fonts are bundled (src/fonts.css). These two used to warm
         connections to Google on every launch; with self-hosted fonts they would open
         sockets to a third party for nothing. -->

    <!-- First-paint loading screen — shown instantly (before the JS bundle
         parses and Vue mounts) so boot isn't a blank window while the
         renderer waits on the local server. Vue's mount() replaces #app's
         content (the app, or the connection-error screen). prefers-color-scheme
         approximates the user's theme until the real appearance is applied. -->
    <style>
      /* BOOT PLATE — pre-JS twin of App.vue's .jw-bootwarm. The plate is stretched to fill
         the window exactly: `contain` left bands the user rejected, and `cover` cropped the
         lettering (which is part of the artwork). See App.vue for the full reasoning. */
      #app-boot { position: fixed; inset: 0; overflow: hidden; background: #d6b689; }
      #app-boot .ab-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
    </style>

    <!-- Curated theming font set (Settings → Appearance) is SELF-HOSTED as of 2026-07-24 —
         see src/fonts.css, imported first from main.js. There is deliberately NO font <link>
         here: this used to be a render-blocking request to fonts.googleapis.com, so the
         window could not paint until a network round trip finished (and on an offline boot,
         until it timed out) — the slow first paint, and the splash flicker as Fraunces
         arrived late and re-laid-out the boot screen. A local-first app ships its own fonts.
         Anything added here that is not a local asset re-breaks first paint. -->

  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <img class="ab-art" src="./src/assets/splash-plate.jpg" alt="JustWrite — a quiet room for the long form" />
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
