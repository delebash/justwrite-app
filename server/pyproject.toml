[project]
name = "justwrite-server"
version = "0.0.1"
description = "JustWrite local server — FastAPI + SQLite backend for the JustWrite desktop app."
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "JustWrite contributors" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "platformdirs>=4",
    "httpx>=0.27",
    # Shared local-LLM runner core — same git dependency JustVoice pins.
    # Frozen into the bundle (PyInstaller); dev uses an editable path install
    # (`pip install -e ../../just-llm-runner`). See the cross-app decision doc.
    "llm-runner @ git+https://github.com/delebash/just-llm-runner.git@7ae099a13e561752ad303ac140b79025243b0577",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[project.scripts]
# `justwrite-server`, NOT `justwrite` — the Tauri desktop binary is
# justwrite(.exe); a same-named console script makes the shell spawn itself
# on Windows (CreateProcessW name resolution). Mirrors JustVoice's fix.
justwrite-server = "justwrite_server.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["justwrite_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
