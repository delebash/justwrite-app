[project]
name = "justwrite-server"
version = "0.0.1"
description = "JustWrite local server — FastAPI + SQLite backend for the JustWrite desktop app."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JustWrite contributors" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "platformdirs>=4",
    "httpx>=0.27",
    "numpy>=1.26",           # rag_search.py BM25/vector math (`import numpy as np`)
    "python-multipart>=0.0.9",  # FastAPI multipart form parsing (image upload + backup restore endpoints)
    # `llm-runner` (the shared local-LLM core — sibling repo) is deliberately NOT a
    # hard dependency here, so `pip install -e .` can never clobber a local editable
    # link with a frozen git copy. In dev it's a LIVE editable link — install ONCE:
    #     pip install -e ../../just-llm-runner
    # After that, every `git pull` of just-llm-runner is live with NO reinstall —
    # just restart the server (no pip, no network). The frozen PyInstaller bundle
    # pulls it from git via the `bundle` extra below.
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.7"]
# Bundle/CI ONLY — the frozen build pulls the shared runner from git MAIN (branch
# HEAD, so it never goes stale). Dev does NOT use this; dev uses the editable local
# link described in the dependencies note above. (2026-08-05 s2 audit: this extra
# pinned a July work branch — claude/admiring-galileo-il3q0o — so a frozen build
# would have shipped July code while the comment promised freshness.)
bundle = ["llm-runner @ git+https://github.com/delebash/just-llm-runner.git@main"]

[project.scripts]
# `justwrite-server`, NOT `justwrite` — the Tauri desktop binary is
# justwrite(.exe); a same-named console script makes the shell spawn itself
# on Windows (CreateProcessW name resolution). Mirrors JustVoice's fix.
justwrite-server = "justwrite_server.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["justwrite_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default: the suite is ~1.3s/test, ~1.0s of it `create_all` against a fresh
# SQLite file, x108 tests. Nothing is skipped -- the same work runs on all cores.
# 147s -> 46s. Safe: no conftest.py, no shared state, every disk-touching test gets
# its own tmp_path
# (per-worker `popen-gw<N>/` subdir) and each worker is its own process.
# Debug serially with `pytest -n 0`. Sibling just-llm-runner has no xdist on purpose --
# its suite is 0.09s/test and not create_all-bound.
# NOTE: addopts is unconditional but xdist is in the `dev` extra -- install `.[dev]`.
addopts = ["-n", "auto"]

[tool.ruff]
line-length = 100
target-version = "py310"
