<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy is delivered as response headers by Tauri's
      webview (configured in src-tauri/tauri.conf.json). A meta-tag CSP
      here would override those headers and break the IPC bridge.
    -->
    <title>JustWrite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- First-paint loading screen — shown instantly (before the JS bundle
         parses and Vue mounts) so boot isn't a blank window while the
         renderer waits on the local server. Vue's mount() replaces #app's
         content (the app, or the connection-error screen). prefers-color-scheme
         approximates the user's theme until the real appearance is applied. -->
    <style>
      #app-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #fbfaf7; color: #9a938a;
        font: 500 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
      }
      #app-boot .app-boot__spin {
        width: 30px; height: 30px; border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.10); border-top-color: #2f8f63;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: #1b1917; color: #8c857c; }
        #app-boot .app-boot__spin { border-color: rgba(255, 255, 255, 0.12); border-top-color: #3fa978; }
      }
    </style>

    <!-- Curated theming font set (Settings → Appearance). One combined
         request; the active families are switched via CSS variables. -->
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Geist:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <div class="app-boot__spin"></div>
        <div>JustWrite</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
