<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy is delivered as response headers by Tauri's
      webview (configured in src-tauri/tauri.conf.json). A meta-tag CSP
      here would override those headers and break the IPC bridge.
    -->
    <title>JustWrite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- First-paint loading screen — shown instantly (before the JS bundle
         parses and Vue mounts) so boot isn't a blank window while the
         renderer waits on the local server. Vue's mount() replaces #app's
         content (the app, or the connection-error screen). prefers-color-scheme
         approximates the user's theme until the real appearance is applied. -->
    <style>
      /* Boot splash — warm CREAM ground (not near-white), the brand JW mark with a thin
         green ring instead of a bare spinner, on a barely-there warm wash so it isn't a
         flat void. KEEP IN SYNC with App.vue .jw-bootwarm (the post-mount warm overlay
         continues this look). Pre-JS: inline SVG + system serif fallback only — Fraunces
         loads async, Georgia carries the mark + wordmark until it does. */
      #app-boot {
        position: fixed; inset: 0; overflow: hidden; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: #f4f0e6; color: #9a938a;
        font: 500 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
      }
      #app-boot::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(58% 55% at 28% 22%, rgba(236, 214, 188, 0.30), transparent 62%),
          radial-gradient(52% 52% at 82% 84%, rgba(236, 214, 188, 0.20), transparent 62%);
      }
      #app-boot > * { position: relative; }
      #app-boot .app-boot__mark { position: relative; width: 76px; height: 76px; display: grid; place-items: center; }
      #app-boot .app-boot__ring {
        position: absolute; inset: 0; border-radius: 50%;
        border: 2.5px solid rgba(47, 143, 99, 0.16); border-top-color: #2f8f63;
        animation: app-boot-spin 0.9s linear infinite;
      }
      #app-boot .app-boot__glyph { width: 52px; height: 52px; filter: drop-shadow(0 4px 12px rgba(61, 35, 80, 0.28)); }
      #app-boot .app-boot__name { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 600; color: #4a453e; letter-spacing: 0.01em; }
      #app-boot .app-boot__tag { margin-top: -8px; font-size: 12.5px; color: #9a938a; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-boot .app-boot__ring { animation-duration: 2.4s; } }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: #1b1917; color: #8c857c; }
        #app-boot::before {
          background:
            radial-gradient(58% 55% at 28% 22%, rgba(236, 214, 188, 0.10), transparent 62%),
            radial-gradient(52% 52% at 82% 84%, rgba(236, 214, 188, 0.07), transparent 62%);
        }
        #app-boot .app-boot__ring { border-color: rgba(63, 169, 120, 0.18); border-top-color: #3fa978; }
        #app-boot .app-boot__name { color: #cfc8bd; }
        #app-boot .app-boot__tag { color: #8c857c; }
      }
    </style>

    <!-- Curated theming font set (Settings → Appearance). One combined
         request; the active families are switched via CSS variables. -->
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Geist:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <div class="app-boot__mark">
          <div class="app-boot__ring"></div>
          <svg class="app-boot__glyph" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="jwmark" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7a2532" />
                <stop offset="1" stop-color="#3d2350" />
              </linearGradient>
            </defs>
            <rect width="52" height="52" rx="13" fill="url(#jwmark)" />
            <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle"
              font-family="Georgia, 'Iowan Old Style', serif" font-style="italic" font-weight="700"
              font-size="22" fill="#fff">JW</text>
          </svg>
        </div>
        <div class="app-boot__name">JustWrite</div>
        <div class="app-boot__tag">Your writing studio is opening…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
