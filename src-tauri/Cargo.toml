[package]
name = "justwrite"
version = "1.0.0"
description = "JustWrite — a novel-writing app"
authors = ["JustWrite contributors"]
edition = "2021"
license = ""

# Tauri 2 expects both a library (for the mobile targets) and a binary (desktop).
# `tauri::generate_context!` lives in the library; the binary just calls `run()`.
[lib]
name = "justwrite_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Opens a URL/path with the OS default handler. Used by `open_external`
# below (Help → "Open on the web", any future "reveal in folder" call).
open = "5"

# Smaller, faster release builds. JustWrite is interactive so we trade
# longer link times for a smaller installer and tighter LTO.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
