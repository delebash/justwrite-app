name: Release

# Manual only. The build is NEVER triggered by push, PR, or tag — only
# by `npm run release` (which calls `gh workflow run release.yml`) or
# the "Run workflow" button on the Actions page.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0). Must already exist on origin.'
        required: true
        type: string
      platforms:
        description: 'Which platforms to build.'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: write   # needed to create / update the GitHub release

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          WIN='{"platform":"windows-latest","target":"win32"}'
          MAC='{"platform":"macos-latest","target":"darwin"}'
          LIN='{"platform":"ubuntu-22.04","target":"linux"}'
          case "$PLATFORMS" in
            windows) MATRIX="{\"include\":[$WIN]}" ;;
            macos)   MATRIX="{\"include\":[$MAC]}" ;;
            linux)   MATRIX="{\"include\":[$LIN]}" ;;
            *)       MATRIX="{\"include\":[$MAC,$LIN,$WIN]}" ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      # The app needs the family kit and the sync engine beside it (server/package.json:
      # file:../../just-llm-runner/server and file:../../just-sqlite-sync; quasar.config.js:
      # ../just-llm-runner/ui), so all three are checked out side by side.
      - name: Checkout (at tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: justwrite-app

      - name: Checkout the kit
        uses: actions/checkout@v4
        with:
          repository: delebash/just-llm-runner
          path: just-llm-runner

      - name: Checkout the sync engine
        uses: actions/checkout@v4
        with:
          repository: delebash/just-sqlite-sync
          path: just-sqlite-sync

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            justwrite-app/package-lock.json
            justwrite-app/src-electron/package-lock.json
            just-llm-runner/server/package-lock.json
            just-sqlite-sync/package-lock.json

      # better-sqlite3 and koffi ship per-platform N-API prebuilds, so nothing native is
      # compiled here; electron-builder (Quasar's Electron mode, quasar.config.js) packages the
      # Electron src-electron/package.json pins.
      - name: Install the kit's server deps
        working-directory: just-llm-runner/server
        run: npm ci
      - name: Install the sync engine's deps
        working-directory: just-sqlite-sync
        run: npm ci --omit=dev

      - name: Install JS deps (the renderer and the server/ workspace)
        working-directory: justwrite-app
        run: npm ci

      - name: Install the desktop app's deps
        working-directory: justwrite-app/src-electron
        run: npm ci

      - name: Build the installers
        working-directory: justwrite-app
        # Quasar's CLI run as node (app-structure §Q.6); -P never: publishing is the next step's job
        run: node node_modules/@quasar/app-vite/bin/quasar.js build -m electron -T ${{ matrix.target }} -P never

      - name: Publish to the release
        working-directory: justwrite-app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "JustWrite $TAG" \
            --notes "JustWrite $TAG. See \`docs.tar.gz\` for the bundled user documentation that the marketing site mirrors for this release." \
            || gh release view "$TAG" >/dev/null  # another platform's job created it first
          shopt -s nullglob
          gh release upload "$TAG" dist/electron/Packaged/*.exe dist/electron/Packaged/*.dmg dist/electron/Packaged/*.AppImage dist/electron/Packaged/*.deb --clobber

  attach-docs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (at tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Pack docs
        # User docs ONLY — `docs/` (recursive) would ship docs/dev/ and
        # docs/plans/ (trackers, backlogs, per-task history) inside a public
        # release asset that the marketing site then mirrors.
        run: tar -czf docs.tar.gz docs/*.md docs/toc.json

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" docs.tar.gz --clobber

  notify-website:
    needs: attach-docs
    runs-on: ubuntu-latest
    steps:
      - name: Trigger justwrite-website rebuild
        env:
          # A Personal Access Token with `repo` scope on justwrite-website.
          # Create one at https://github.com/settings/tokens, then add it as
          # repo secret WEBSITE_DISPATCH_TOKEN. The default GITHUB_TOKEN
          # cannot dispatch workflows in another repository.
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set — skipping website rebuild trigger."
            echo "Configure the secret to enable automatic docs sync."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/delebash/justwrite-website/dispatches \
            -d "{\"event_type\":\"docs-updated\",\"client_payload\":{\"tag\":\"${{ inputs.tag }}\"}}"
